<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111519">
  <meta name="description" content="BarTab - drankrekeningen voor de bar">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <style>
    .inventory-row { grid-template-columns: minmax(110px, 1fr) repeat(3, minmax(90px, 0.8fr)); }
    .inventory-row label { margin: 0; font-size: 12px; }
    .inventory-row input { min-height: 46px; }
    .refill-row { justify-content: flex-start; }
    .refill-row input { width: 22px; min-width: 22px; min-height: 22px; accent-color: var(--accent); }
    .refill-row span { display: flex; flex-direction: column; gap: 4px; }
    .balance-actions { display: flex; flex-wrap: nowrap; justify-content: flex-end; gap: 8px; }
    .balance-actions .compact-button { white-space: nowrap; padding-inline: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .stat-card { padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
    .stat-card strong { display: block; margin-top: 6px; font-size: 25px; color: var(--accent); }
    .stats-layout { display: grid; grid-template-columns: minmax(170px, 230px) 1fr; gap: 22px; }
    .stats-filters { display: flex; flex-direction: column; gap: 6px; }
    .stats-filter { padding: 13px 14px; border: 1px solid transparent; border-radius: 9px; background: transparent; text-align: left; color: var(--muted); }
    .stats-filter.is-active, .stats-filter:hover { border-color: var(--line); background: var(--surface-2); color: var(--text); }
    .stats-panel h3 { margin-bottom: 14px; }
    .leaderboard-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .low-stock-warning { position: fixed; left: 50%; bottom: 22px; z-index: 25; width: min(560px, calc(100% - 32px)); padding: 15px 18px; border: 1px solid #ff6d68; border-radius: 10px; background: #8e2728; color: #fff; font-weight: 800; box-shadow: 0 10px 30px #0008; opacity: 0; pointer-events: none; transform: translate(-50%, 18px); transition: opacity .2s, transform .2s; }
    .low-stock-warning.is-visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 700px) { .inventory-row { grid-template-columns: 1fr 1fr; } .inventory-row strong { grid-column: 1 / -1; } .balance-actions { justify-content: stretch; } .balance-actions button { flex: 1; } .stats-layout { grid-template-columns: 1fr; } .stats-filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .inventory-row { grid-template-columns: 1fr 1fr; } }
  </style>
  <title>BarTab</title>
</head>
<body>
  <header class="app-header">
    <div class="brand-mark" aria-hidden="true">BT</div><div><p class="eyebrow">BARREKENINGEN</p><h1>BarTab</h1></div>
    <button class="icon-button" data-action="admin" aria-label="Admin openen" title="Admin">⚙</button>
  </header>

  <main id="app" class="app-shell">
    <section id="home-view" class="view" aria-labelledby="home-title">
      <div class="home-layout"><div><div id="customers-list" class="customer-grid"></div><div id="empty-state" class="empty-state is-hidden"><span class="empty-icon" aria-hidden="true">◌</span><h3>Nog geen klanten</h3><p>Voeg klanten toe via het adminpaneel.</p></div></div>
        <aside class="groups-panel"><div class="section-label-row"><h3>Groepen</h3><button class="small-button" data-action="new-group" aria-label="Groep toevoegen">＋</button></div><div id="groups-list"></div></aside>
      </div>
    </section>
    <section id="group-view" class="view is-hidden" aria-labelledby="group-title"><div class="view-heading"><button class="back-button group-back" data-action="home" aria-label="Terug naar overzicht">‹</button><div><p class="eyebrow">GROEP</p><h2 id="group-title">-</h2></div><button id="group-lock" class="icon-button" data-action="toggle-group-lock" aria-label="Groep vergrendelen">🔓</button></div><div id="group-customers" class="customer-grid"></div></section>
    <section id="admin-view" class="view is-hidden" aria-labelledby="admin-title"><div class="view-heading"><div><p class="eyebrow">BEHEER</p><h2 id="admin-title">Admin</h2></div><button class="back-button" data-action="home" aria-label="Terug naar overzicht">‹</button></div><div class="admin-grid"><button class="admin-card" data-admin-view="inventory">📦<strong>Voorraad</strong><span>Koelkast, kelder en hervulling</span></button><button class="admin-card" data-admin-view="assortment">💶<strong>Prijzen / Assortiment</strong><span>Dranken en prijzen</span></button><button class="admin-card" data-admin-view="customers">👥<strong>Klanten</strong><span>Klanten en groepen</span></button><button class="admin-card" data-admin-view="history">🧾<strong>Geschiedenis</strong><span>Alle transacties</span></button><button class="admin-card" data-admin-view="balances">⚖️<strong>Balansoverzicht</strong><span>Schulden en bijstortingen</span></button><button class="admin-card" data-admin-view="stats">📊<strong>Statistiek</strong><span>Verkoop en omzet</span></button></div></section>
    <section id="inventory-view" class="view is-hidden sub-view"><div class="view-heading"><button class="back-button" data-action="admin-home" aria-label="Terug naar admin">‹</button><h2>Voorraadbeheer</h2><button class="secondary-button compact-button" data-action="refill">Hervulling</button></div><div id="inventory-list" class="admin-list"></div></section>
    <section id="assortment-view" class="view is-hidden sub-view"><div class="view-heading"><button class="back-button" data-action="admin-home" aria-label="Terug naar admin">‹</button><h2>Prijzen / Assortiment</h2></div><div id="settings-list" class="admin-list"></div><button class="primary-button" data-action="add-drink">＋ Drank toevoegen</button></section>
    <section id="customers-view" class="view is-hidden sub-view"><div class="view-heading"><button class="back-button" data-action="admin-home" aria-label="Terug naar admin">‹</button><h2>Klanten</h2></div><div id="admin-customers-list" class="admin-list"></div><div class="button-row"><button class="primary-button" data-action="add-customer">＋ Klant toevoegen</button><button class="secondary-button" data-action="manage-groups">Groepen beheren</button></div><div id="admin-groups-list" class="admin-list"></div></section>
    <section id="history-view" class="view is-hidden sub-view"><div class="view-heading"><button class="back-button" data-action="admin-home" aria-label="Terug naar admin">‹</button><h2>Geschiedenis</h2></div><div class="filter-row"><input id="history-search" type="search" placeholder="Zoek klant..." aria-label="Zoek klant"><select id="history-date"><option value="all">Alles</option><option value="today">Vandaag</option><option value="week">Deze week</option></select></div><div id="history-list" class="admin-list"></div></section>
    <section id="balances-view" class="view is-hidden sub-view"><div class="view-heading"><button class="back-button" data-action="admin-home" aria-label="Terug naar admin">‹</button><h2>Balansoverzicht</h2></div><div id="balances-list" class="admin-list"></div></section>
    <section id="stats-view" class="view is-hidden sub-view"><div class="view-heading"><button class="back-button" data-action="admin-home" aria-label="Terug naar admin">‹</button><h2>Statistiek</h2></div><div class="stats-layout"><nav id="stats-filters" class="stats-filters" aria-label="Statistiek voor"><button class="stats-filter is-active" data-stat-filter="all">Algemeen</button></nav><div id="stats-list" class="stats-panel"></div></div></section>
  </main>

  <div id="modal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-card"><div class="modal-heading"><h2 id="modal-title">BarTab</h2><button class="icon-button" data-action="close-modal" aria-label="Sluiten">×</button></div><form id="modal-form"><div id="modal-fields"></div><div id="modal-error" class="form-error"></div><div class="modal-actions"><button type="button" class="secondary-button" data-action="close-modal">Annuleren</button><button type="submit" class="primary-button">Opslaan</button></div></form></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div><div id="low-stock-warning" class="low-stock-warning" role="status" aria-live="polite"></div><span id="app-version" aria-label="Appversie" style="position:fixed;right:12px;bottom:8px;color:#aab5ba;font-size:11px;opacity:.7;pointer-events:none"></span><script src="script.js"></script>
</body>
</html>
